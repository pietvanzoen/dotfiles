
# theme generated with edkolev/tmuxline.vim
source-file ~/.local/share/lightlight.tmux-theme
source-file ~/.tmux.conf.local

# reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# set $TERM type
set -g default-terminal "tmux-256color"
set -g cursor-colour "#d33682"

set-option -g focus-events on

# turn on mouse interactions
set -g mouse on
# toggle mouse mode (useful for Cmd+Click URL opening in Ghostty)
bind m set -g mouse \; display "Mouse: #{?mouse,ON,OFF}"


# Use vim keybindings in copy mode
# setw -g mode-keys vi
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
# bind y run-shell "reattach-to-user-namespace -l zsh -c 'tmux show-buffer | pbcopy'"

# set scrollback history to 10000 (10k)
set -g history-limit 10000

# shorten command delay
set -sg escape-time 1


# fix cursor shape for zsh vi mode
# set -ga terminal-overrides ",screen*:Ss=^[[%p1%d q:Se=^[[2 q"
set-option -sa terminal-overrides ",xterm-*:RGB"
# Prevent apps (Claude Code) from clearing scrollback history (E3 = \033[3J)
set-option -sa terminal-overrides ",*:E3@"
# Allow OSC 8 hyperlinks — tell tmux the terminal supports them
# Ghostty identifies itself as "ghostty" (not xterm-256color) to tmux
set-option -ga terminal-features ",ghostty*:hyperlinks"

# set window and pane index to 1 (0 by default)
set-option -g base-index 1
setw -g pane-base-index 1

# Make the current window the first window
bind T swap-window -t 1

# use <prefix> s for horizontal split
bind s split-window -v -c "#{pane_current_path}"
# use <prefix> v for vertical split
bind v split-window -h -c "#{pane_current_path}"
# default split keys also use current path
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Seamless vim/tmux pane navigation (vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'if -F "#{pane_at_left}"   "" "select-pane -L"'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'if -F "#{pane_at_bottom}" "" "select-pane -D"'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'if -F "#{pane_at_top}"    "" "select-pane -U"'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'if -F "#{pane_at_right}"  "" "select-pane -R"'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
# Restore clear screen via prefix (C-l is now consumed by pane navigation)
bind C-l send-keys 'C-l'

# vim like pane swapping
# bind -n M-Left select-pane -L
# bind -n M-Right select-pane -R
# bind -n M-Up select-pane -U
# bind -n M-Down select-pane -D

# resize panes more easily
bind < resize-pane -L 10
bind > resize-pane -R 10
bind - resize-pane -D 10
bind + resize-pane -U 10

set -g pane-border-format "#{?pane_active,#[fg=colour0 bg=colour6 bold] #P: #{pane_current_command} — #{b:pane_current_path} #[default],#[fg=colour0 bg=colour10] #P: #{pane_current_command} — #{b:pane_current_path} #[default]}"
set -g pane-border-status top

set-option -g status-interval 5
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

bind t command-prompt -p "(rename-pane)" -I "#T" "select-pane -T '%%'"

bind-key -n C-9 switch-client -n
bind-key -n C-0 switch-client -p

run-shell ~/.tmux/tmux-safekill/safekill.tmux

# Golden ratio auto-resize (prefix+G to toggle per window)
set-hook -g pane-focus-in  "run-shell '$HOME/.local/bin/tmux-golden-ratio'"
set-hook -g window-resized "run-shell '$HOME/.local/bin/tmux-golden-ratio'"
bind G run-shell "$HOME/.local/bin/tmux-golden-ratio toggle"

set -s user-keys[0] "\e[1;6Z"
bind-key -n User0 previous-window
set -s user-keys[1] "\e[1;5I"
bind-key -n User1 next-window

# prefix + C-p: switch windows via fzf popup
bind C-p run-shell "$HOME/.local/bin/tmux-window-jump"
